name: Application verification
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: node scripts/benchmark-api.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: api-benchmark
          path: docs/benchmarks/api-results.json
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t still-demo .
      - run: docker run -d --name still -p 127.0.0.1:3001:3001 still-demo
      - run: |
          for attempt in $(seq 1 30); do
            if curl --fail http://127.0.0.1:3001/api/health; then exit 0; fi
            sleep 1
          done
          docker logs still
          exit 1
      - if: always()
        run: docker rm -f still
